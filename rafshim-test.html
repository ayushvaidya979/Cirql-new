<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f3ed" />
    <title>EcoBin · Sell & Recycle Your Old Electronics</title>
    <meta name="description" content="Sell your old phones, laptops and gadgets. Free doorstep pickup, on-the-spot payment and responsible e-waste recycling." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>document.documentElement.classList.add('js')</script>
    <script>
window.requestAnimationFrame=cb=>setTimeout(()=>cb(performance.now()),16);window.cancelAnimationFrame=id=>clearTimeout(id);
window.IntersectionObserver=class{constructor(cb,o){this.cb=cb;this.o=o||{};this.els=new Set();this.check=()=>{const m=/-(\d+)%/.exec(this.o.rootMargin||'');const cut=m?innerHeight*m[1]/100:0;const es=[...this.els].map(el=>{const r=el.getBoundingClientRect();return{target:el,isIntersecting:r.top<innerHeight-cut&&r.bottom>cut}});if(es.length)this.cb(es,this)};addEventListener('scroll',this.check)}observe(el){this.els.add(el);setTimeout(this.check,30)}unobserve(el){this.els.delete(el)}disconnect(){this.els.clear();removeEventListener('scroll',this.check)}};
</script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
